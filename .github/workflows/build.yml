# ---------------------------------------------------------------------------------------
# Compila la APK de Hurrican para Android.
#
# Se puede lanzar a mano (Actions -> Build APK -> Run workflow) o automaticamente al subir
# cambios que afecten al proyecto Android.
#
# Al terminar, la APK queda como artefacto descargable desde la propia ejecucion.
#
# Notas:
#  - Los datos del juego (~91 MB) se empaquetan dentro del APK, asi que la APK resultante
#    pesa ~100 MB. GitHub limita los artefactos a 10 GB, no es problema.
#  - Solo se compilan arm64-v8a y armeabi-v7a para que el artefacto no crezca al doble por
#    culpa de las ABI de emulador; para generar tambien x86_64 usa el input "abi".
# ---------------------------------------------------------------------------------------
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI a compilar"
        required: true
        default: "arm64-v8a,armeabi-v7a"
        type: choice
        options:
          - "arm64-v8a,armeabi-v7a"
          - "arm64-v8a"
          - "armeabi-v7a"
          - "arm64-v8a,armeabi-v7a,x86_64"
      build_type:
        description: "Tipo de compilacion"
        required: true
        default: "debug"
        type: choice
        options:
          - "debug"
          - "release"
  # En cualquier rama (con cambios en el juego, el proyecto Android o este workflow): asi se
  # puede comprobar la APK desde una rama de trabajo antes de fusionarla.
  # Ojo: el boton "Run workflow" (workflow_dispatch) solo aparece cuando este fichero existe
  # en la rama por defecto del repositorio.
  push:
    paths:
      - "Hurrican/**"
      - "android/**"
      # Incluye los scripts auxiliares (.github/scripts/...), que tambien forman parte de
      # la compilacion: si se tocan, conviene volver a comprobarla.
      - ".github/**"
  pull_request:
    paths:
      - "Hurrican/**"
      - "android/**"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Los datos del juego estan en el propio repositorio; no hay submodulos.
          fetch-depth: 1

      - name: Comprobar que estan los datos del juego
        run: |
          set -e
          for d in Hurrican/src Hurrican/data Hurrican/lang Hurrican/3rdparty/glm; do
            if [ ! -d "$d" ]; then
              echo "::error::Falta la carpeta $d, el APK se generaria sin datos del juego"
              exit 1
            fi
          done
          echo "Datos del juego presentes:"
          du -sh Hurrican/data Hurrican/lang

      # Comprobaciones baratas previas al build: evita publicar una APK con los creditos
      # antiguos o con iconos tactiles que se quedaron fuera del repositorio.
      - name: Validar créditos Android e iconos táctiles
        run: |
          set -eu
          CREDITS=Hurrican/src/creditStrings.hpp
          for credit in "Luis Antonio Aguilar" "Asistente" "GitHub"; do
            if ! grep -Fq "\"$credit\"" "$CREDITS"; then
              echo "::error::Falta el credito '$credit' en $CREDITS"
              exit 1
            fi
          done
          if grep -Eiq 'poke53280|www\.poke53280' Hurrican/src/creditStrings.hpp Hurrican/src/CCracktro.cpp Hurrican/src/Menu.cpp Hurrican/lang/*.lng; then
            echo "::error::Quedó una referencia visible a Poke53280 en los textos distribuidos"
            exit 1
          fi
          for icon in touch_arma_v2.png touch_salto_v2.png touch_fuego_v2.png touch_granada_v2.png touch_bomba_v2.png touch_pausa_v2.png touch_ajustes_v2.png touch_powerline.png touch_blitz.png; do
            if [ ! -s "Hurrican/data/textures/$icon" ]; then
              echo "::error::Falta el icono táctil Hurrican/data/textures/$icon"
              exit 1
            fi
          done

      - name: Validar controles tácticos metálicos y persistencia
        run: |
          python3 tools/touch-ui/test-icons.py
          c++ -std=c++17 -Wall -Wextra -pedantic tools/touch-ui/test-layout.cpp -o /tmp/test-touch-layout
          /tmp/test-touch-layout "$RUNNER_TEMP/touch-layout-test.txt"
          c++ -std=c++17 -Wall -Wextra -pedantic tools/touch-ui/test-store.cpp -o /tmp/test-offline-store
          /tmp/test-offline-store "$RUNNER_TEMP/offline-store-test.txt"

      # Comprueba también los includes de un fallo que, si no, solo aparece tras compilar:
      # un fichero que existe en local pero se quedó fuera del repositorio por .gitignore.
      - name: Comprobar que todos los #include apuntan a ficheros del repositorio
        run: python3 .github/scripts/check_includes.py .

      # Los shaders se compilan en el movil, no aqui: un error en un shader no se ve hasta
      # ejecutar el juego. Esta comprobacion (segundos) detecta lo mas tipico: usar una
      # constante `c_...` que el motor no inyecta, mezclar GLSL 100 con 320, o desbalancear
      # llaves al editarlos.
      - name: Comprobar los shaders
        run: python3 .github/scripts/check_shaders.py .

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Se instala Gradle explicitamente en lugar de usar ./gradlew: el wrapper que viene en
      # el repositorio es antiguo y la compilacion no debe depender de su suerte.
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      # Los runners de ubuntu-latest ya traen el SDK de Android instalado. Se instalan los
      # componentes que faltan con sdkmanager en lugar de reconfigurar el SDK entero: es mas
      # rapido y menos fragil. Las versiones deben coincidir con app/build.gradle
      # (compileSdk 34, ndkVersion 26.1.10909125, cmake 3.22.1).
      - name: Instalar componentes del SDK de Android
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_HOME no esta definido"; exit 1
          fi
          echo "SDK en: $SDK"
          ls "$SDK"

          # Licencias primero: sin ellas sdkmanager se queda esperando una respuesta.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # Comprobacion explicita: si faltase el NDK, Gradle intentaria descargarlo el solo y el
      # error real quedaria enterrado en su log.
      - name: Comprobar que el NDK esta disponible
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/ndk/26.1.10909125" ]; then
            echo "::error::No se encuentra el NDK 26.1.10909125 en $SDK/ndk"
            ls "$SDK/ndk" || true
            exit 1
          fi
          echo "NDK OK: $SDK/ndk/26.1.10909125"
          ls "$SDK/cmake" || true

      - name: Compilar la APK
        working-directory: android
        # Sin daemon: cada runner es efimero y el daemon solo anade tiempo de arranque.
        # La primera compilacion tarda bastante (SDL + 186 ficheros del motor x 2 ABI).
        timeout-minutes: 100
        env:
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a,armeabi-v7a' }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set +e
          # Cualquier fallo del propio script (antes o despues de Gradle) queda anotado.
          trap 'echo "::error title=Compilar::fallo en la linea $LINENO (codigo $?)"' ERR
          echo "Espacio en disco, CPUs y memoria disponibles antes de compilar:"
          df -h . | tail -n 2 || true
          nproc || true
          free -m | head -n 2 || true

          # La ABI se pasa como propiedad de Gradle (-Pabi=...) y app/build.gradle la usa si
          # esta definida; si no, se queda con la lista por defecto.
          #
          # La salida se guarda y se vuelca al final del paso, en la parte del log que GitHub
          # muestra con la linea del error. Asi el motivo real queda visible sin tener que
          # abrir el log completo.
          gradle --no-daemon --console=plain --stacktrace \
                 -Pabi="$ABI" \
                 "assemble$(echo ${BUILD_TYPE^})" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Ultimas 200 lineas de la compilacion"
            tail -n 200 "$RUNNER_TEMP/gradle.log"
            echo "::endgroup::"

            # El log completo no es accesible desde fuera (vive en un almacenamiento que no
            # siempre responde) y las anotaciones son lo unico que viaja con la ejecucion y
            # se puede consultar por API. El script recorta el log alrededor de los errores
            # reales y los publica como anotaciones troceadas.
            python3 "$GITHUB_WORKSPACE/.github/scripts/annotate_log.py" \
              "$RUNNER_TEMP/gradle.log" --title "Gradle" || true

            echo "::error::Gradle fallo con codigo $status"
            exit "$status"
          fi

      - name: Localizar la APK
        id: locate
        run: |
          set -eu
          # Si algo falla aqui, que quede dicho en una anotacion con la linea exacta: este
          # paso no produce log de Gradle, asi que sin esto el fallo es invisible.
          trap 'echo "::error title=Localizar la APK::fallo en la linea $LINENO (codigo $?)"' ERR

          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::La compilacion termino pero no se genero ninguna APK"
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          # Que la APK se genere no significa que sea jugable: los datos del juego (~91 MB)
          # y libmain.so tienen que estar dentro. El script lo comprueba y publica una
          # anotacion con el motivo si falta algo.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_apk.py" "$APK"

          # Nombre de paquete y ABI, para dejar constancia en el log.
          AAPT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Subir la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hurrican-android-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      # Guardar el log de Gradle cuando algo falla: es lo unico que permite diagnosticar sin
      # tener acceso a la maquina.
      - name: Guardar registro de la compilacion
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/gradle.log
            android/**/build/outputs/logs/
            android/.gradle/**
          if-no-files-found: ignore
          retention-days: 7
