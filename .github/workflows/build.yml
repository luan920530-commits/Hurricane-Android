# ---------------------------------------------------------------------------------------
# Compila la APK de Hurrican para Android.
#
# Se puede lanzar a mano (Actions -> Build APK -> Run workflow) o automaticamente al subir
# cambios que afecten al proyecto Android.
#
# Al terminar, la APK queda como artefacto descargable desde la propia ejecucion.
#
# Notas:
#  - Los datos del juego (~91 MB) se empaquetan dentro del APK, asi que la APK resultante
#    pesa ~100 MB. GitHub limita los artefactos a 10 GB, no es problema.
#  - Solo se compilan arm64-v8a y armeabi-v7a para que el artefacto no crezca al doble por
#    culpa de las ABI de emulador; para generar tambien x86_64 usa el input "abi".
# ---------------------------------------------------------------------------------------
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI a compilar"
        required: true
        default: "arm64-v8a,armeabi-v7a"
        type: choice
        options:
          - "arm64-v8a,armeabi-v7a"
          - "arm64-v8a"
          - "armeabi-v7a"
          - "arm64-v8a,armeabi-v7a,x86_64"
      build_type:
        description: "Tipo de compilacion"
        required: true
        default: "debug"
        type: choice
        options:
          - "debug"
          - "release"
  # En cualquier rama (con cambios en el juego, el proyecto Android o este workflow): asi se
  # puede comprobar la APK desde una rama de trabajo antes de fusionarla.
  # Ojo: el boton "Run workflow" (workflow_dispatch) solo aparece cuando este fichero existe
  # en la rama por defecto del repositorio.
  push:
    paths:
      - "Hurrican/**"
      - "android/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Hurrican/**"
      - "android/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Los datos del juego estan en el propio repositorio; no hay submodulos.
          fetch-depth: 1

      - name: Comprobar que estan los datos del juego
        run: |
          set -e
          for d in Hurrican/src Hurrican/data Hurrican/lang Hurrican/3rdparty/glm; do
            if [ ! -d "$d" ]; then
              echo "::error::Falta la carpeta $d, el APK se generaria sin datos del juego"
              exit 1
            fi
          done
          echo "Datos del juego presentes:"
          du -sh Hurrican/data Hurrican/lang

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Se instala Gradle explicitamente en lugar de usar ./gradlew: el wrapper que viene en
      # el repositorio es antiguo y la compilacion no debe depender de su suerte.
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      # Los runners de ubuntu-latest ya traen el SDK de Android instalado. Se instalan los
      # componentes que faltan con sdkmanager en lugar de reconfigurar el SDK entero: es mas
      # rapido y menos fragil. Las versiones deben coincidir con app/build.gradle
      # (compileSdk 34, ndkVersion 26.1.10909125, cmake 3.22.1).
      - name: Instalar componentes del SDK de Android
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_HOME no esta definido"; exit 1
          fi
          echo "SDK en: $SDK"
          ls "$SDK"

          # Licencias primero: sin ellas sdkmanager se queda esperando una respuesta.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # Comprobacion explicita: si faltase el NDK, Gradle intentaria descargarlo el solo y el
      # error real quedaria enterrado en su log.
      - name: Comprobar que el NDK esta disponible
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/ndk/26.1.10909125" ]; then
            echo "::error::No se encuentra el NDK 26.1.10909125 en $SDK/ndk"
            ls "$SDK/ndk" || true
            exit 1
          fi
          echo "NDK OK: $SDK/ndk/26.1.10909125"
          ls "$SDK/cmake" || true

      - name: Compilar la APK
        working-directory: android
        # Sin daemon: cada runner es efimero y el daemon solo anade tiempo de arranque.
        # La primera compilacion tarda bastante (SDL + 186 ficheros del motor x 2 ABI).
        timeout-minutes: 100
        env:
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a,armeabi-v7a' }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set +e
          # La ABI se pasa como propiedad de Gradle (-Pabi=...) y app/build.gradle la usa si
          # esta definida; si no, se queda con la lista por defecto.
          #
          # La salida se guarda y se vuelca al final del paso, en la parte del log que GitHub
          # muestra con la linea del error. Asi el motivo real queda visible sin tener que
          # abrir el log completo.
          gradle --no-daemon --console=plain --stacktrace \
                 -Pabi="$ABI" \
                 "assemble$(echo ${BUILD_TYPE^})" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Ultimas 200 lineas de la compilacion"
            tail -n 200 "$RUNNER_TEMP/gradle.log"
            echo "::endgroup::"

            # Las anotaciones viajan con la ejecucion y se pueden consultar por API, mientras
            # que el log completo requiere otro host. Volcarlas aqui hace que el motivo del
            # fallo este disponible desde cualquier sitio.
            #
            # Importante: las lineas interesantes son las ULTIMAS del log (Gradle escribe
            # "FAILURE: Build failed with an exception." al final). Buscar en todo el fichero
            # solo devuelve las primeras tareas ejecutadas, que no dicen nada.
            echo "::group::Errores detectados"
            last_note() {
              safe=$(printf '%s' "$1" | tr -d '\r' | tr -s ' ' | cut -c1-900)
              [ -n "$safe" ] || return 0
              echo "::error title=$2::${safe}"
              echo "$safe"
            }
            # GitHub limita a 10 las anotaciones de error por paso: se emiten las 6 del
            # bloque de error y las 4 ultimas lineas del log, nada mas.
            # 1) El bloque de error propiamente dicho, si aparece.
            grep -A 6 -E "^FAILURE: Build failed|^\* What went wrong" "$RUNNER_TEMP/gradle.log" \
              | tail -n 6 | while IFS= read -r l; do last_note "$l" "Gradle"; done
            # 2) Y siempre, las ultimas lineas del log: ahi esta el mensaje del compilador o
            #    del enlazador cuando Gradle se calla.
            tail -n 120 "$RUNNER_TEMP/gradle.log" | grep -v '^[[:space:]]*$' | tail -n 4 \
              | while IFS= read -r l; do last_note "$l" "Gradle (final)"; done
            echo "::endgroup::"

            echo "::error::Gradle fallo con codigo $status"
            exit "$status"
          fi

      - name: Localizar la APK
        id: locate
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::La compilacion termino pero no se genero ninguna APK"
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Subir la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hurrican-android-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      # Guardar el log de Gradle cuando algo falla: es lo unico que permite diagnosticar sin
      # tener acceso a la maquina.
      - name: Guardar registro de la compilacion
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/gradle.log
            android/**/build/outputs/logs/
            android/.gradle/**
          if-no-files-found: ignore
          retention-days: 7
